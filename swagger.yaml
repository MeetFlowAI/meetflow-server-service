  /account/get-profile:
    get:
      tags: [Common / Account]
      summary: Get profile
      description: >
        Returns the authenticated user's profile.
        Works for both master users and org users.
        Sensitive fields (password, reset tokens) are excluded.
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
