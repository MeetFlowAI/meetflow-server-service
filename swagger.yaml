  /workspace/{workspaceId}/channels/{channelId}/members/remove-member/{userId}:
    delete:
      tags: [Workspace / Channel Members]
      summary: Remove a member from a channel
      operationId: removeChannelMember
      security:
        - BearerAuth: []
