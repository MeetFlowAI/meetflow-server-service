        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Members retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/WorkspaceMember"
                          total:
                            type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/{workspaceId}/members/add-member:
    post:
      tags: [Workspace / Members]
      summary: Add a member to a workspace
      description: The user must already be an org member. Only org admins can add members.
      operationId: addWorkspaceMember
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMemberRequest"
            example:
              user_id: 5
              role: workspace_member
      responses:
        "201":
          description: Member added successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: User is already a workspace member

  /workspace/{workspaceId}/members/update-member/{userId}:
    patch:
      tags: [Workspace / Members]
      summary: Update a member's workspace role
      description: |
        Changes the role of a workspace member.
        Cannot change your own role. Cannot demote the workspace owner.
      operationId: updateWorkspaceMemberRole
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceMemberRoleRequest"
            example:
              role: workspace_admin
      responses:
        "200":
          description: Member role updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/{workspaceId}/members/remove-member/{userId}:
    delete:
      tags: [Workspace / Members]
      summary: Remove a member from a workspace
      description: |
        Cannot remove yourself (use leave workspace instead).
        Cannot remove the workspace owner.
      operationId: removeWorkspaceMember
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 5
      responses:
        "200":
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

