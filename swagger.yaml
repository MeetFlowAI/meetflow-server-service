          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /account/update-profile:
    post:
      tags: [Common / Account]
      summary: Update profile
      description: >
        Updates non-sensitive profile fields (first_name, last_name).
        Sensitive fields (password, role_id, is_active) are silently ignored.
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              first_name: Jane
              last_name: Updated
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /account/change-password:
    put:
      tags: [Common / Account]
      summary: Change password
      description: >
        Verifies the current password then updates to the new password.
        Use this for voluntary password changes.
        For forced first-login password change (must_change_password = true),
        use POST /auth/reset-password with the temp password as the token flow,
        or call this endpoint with the temp password as currentPassword.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: "TempAutoPass@1"
              newPassword: "MyNewPass@456"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

