  /organization/invitations/accept-invitation:
    post:
      tags: [Organization / Invitations]
      summary: Accept an invitation (public — no auth needed)
      description: |
        Called when an invited user clicks the invite link in their email.
        The invitation `token` comes from the `?token=` query param in the invite link.
        The `tenant_schema` comes from the `?schema=` query param.

        On success, creates the user account and returns basic profile info.
        The user should then log in normally via POST /auth/login.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
            example:
              token: "a3f7c2d1e4b5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
              tenant_schema: "org_acme_com"
              first_name: Alex
              last_name: Johnson
              password: "MySecure@Pass1"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: User already exists

  /organization/invitations/get-all-invitations:
    get:
      tags: [Organization / Invitations]
      summary: Get all invitations
      operationId: getOrgInvitations
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, cancelled, expired, rejected]
      responses:
        "200":
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/Invitation"
                          total:
                            type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /organization/invitations/send-invitation:
    post:
      tags: [Organization / Invitations]
      summary: Send an invitation
      description: |
        Sends an email invitation to the provided address.
        The invitation link contains a `?token=` and `?schema=` param that the frontend
        must pass to POST /organization/invitations/accept-invitation.
        Invitations expire after **7 days**.
      operationId: sendInvitation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInvitationRequest"
            example:
              email: alex.johnson@acme.com
              role_id: 3
      responses:
        "201":
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: User already a member or invitation already pending

  /organization/invitations/resend-invitation/{id}:
    patch:
      tags: [Organization / Invitations]
      summary: Resend an invitation
      description: Generates a new token, resets the expiry to 7 days from now, and resends the email.
      operationId: resendInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Invitation resent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /organization/invitations/cancel-invitation/{id}:
    delete:
      tags: [Organization / Invitations]
      summary: Cancel a pending invitation
      operationId: cancelInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Invitation cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKSPACE — Workspaces
  # ═══════════════════════════════════════════════════════════════════════════
  /workspace/workspaces/my-workspaces:
    get:
      tags: [Workspace / Workspaces]
      summary: Get my workspaces
      description: |
        Returns all workspaces the authenticated user belongs to, each including
        `my_role` (workspace_owner / workspace_admin / workspace_member).
        This is the workspace selection screen shown after org login.
      operationId: getMyWorkspaces
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workspaces retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Workspace"
                            - type: object
                              properties:
                                my_role:
                                  type: string
                                  enum:
                                    [
                                      workspace_owner,
                                      workspace_admin,
                                      workspace_member,
                                    ]
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /workspace/workspaces/get-all-workspaces:
    get:
      tags: [Workspace / Workspaces]
      summary: Get all workspaces (admin)
      description: Returns all workspaces in the org. Admin-only.
      operationId: getAllWorkspaces
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuerySearch"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryIsActive"
      responses:
        "200":
          description: Workspaces retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/Workspace"
                          total:
                            type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /workspace/workspaces/get-workspace-by-id/{id}:
    get:
      tags: [Workspace / Workspaces]
      summary: Get workspace by ID
      description: The requesting user must be a member of the workspace.
      operationId: getWorkspaceById
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Workspace retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/workspaces/create-workspace:
    post:
      tags: [Workspace / Workspaces]
      summary: Create a workspace
      description: |
        Creates a new workspace. The creator is automatically added as `workspace_owner`.
        A default **#general** public channel is auto-created and the creator is added to it.
        Plan limit `max_workspaces` is enforced.
      operationId: createWorkspace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
            example:
              name: Engineering
              description: "All things engineering"
      responses:
        "201":
          description: Workspace created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Plan workspace limit reached
        "409":
          description: Workspace name already exists

  /workspace/workspaces/update-workspace/{id}:
    patch:
      tags: [Workspace / Workspaces]
      summary: Update a workspace
      description: Only the workspace owner or org admin can update workspace details.
      operationId: updateWorkspace
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/workspaces/delete-workspace/{id}:
    delete:
      tags: [Workspace / Workspaces]
      summary: Delete a workspace
      description: Only the workspace owner or org super admin can delete a workspace.
      operationId: deleteWorkspace
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Workspace deleted (deactivated) successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

