openapi: 3.0.3

info:
  title: MeetFlow API
  version: 1.0.0
  description: |
    ## MeetFlow Backend REST API

    This API powers the MeetFlow SaaS platform. It is divided into four
    top-level sections:

    | Section          | Base Path          | Description                                    |
    |------------------|--------------------|------------------------------------------------|
    | **Common**       | `/api/v1/auth` & `/api/v1/account`          | Authentication & account management            |
    | **Master**       | `/api/v1/master`   | MeetFlow internal admin panel (master context) |
    | **Organization** | `/api/v1/organization` | Organisation-level management (coming soon) |
    | **Workspace**    | `/api/v1/workspace`    | Workspace & channel management (coming soon)|

    ### Authentication
    All **Master**, **Organization**, and **Workspace** routes require a valid
    JWT `accessToken` in the `Authorization` header:
    ```
    Authorization: Bearer <accessToken>
    ```
    Use the **Login** endpoint to obtain tokens.

    ### Standard Response Envelope
    Every response (success or error) is wrapped in:
    ```json
    {
      "status": {
        "response_code": 200,
        "response_message": "Success!"
      },
      "message": "Human-readable message",
      "data": { ... }
    }
    ```
    Error responses replace `data` with an `error` object containing `details`.

  contact:
    name: MeetFlow Engineering
  license:
    name: ISC

servers:
  - url: http://localhost:8000/api/v1
    description: Local Development
  - url: https://api.meetflow.builtbyag09.tech/api/v1
    description: Production

tags:
  - name: Common / Health
    description: Server health check
  - name: Common / Auth
    description: >
      Unified authentication — single login endpoint silently routes
      master users (personal/free email domains) and organisation users
      (corporate/edu domains) based on email domain mapping.
  - name: Common / Account
    description: >
      Authenticated user profile and password management.
      Works for both master users and org users.
  - name: Master / Roles
    description: >
      Manage master-level roles (e.g. master_super_admin, master_admin,
      master_member). Requires authenticate + requireMasterContext.
  - name: Master / Users
    description: >
      Manage MeetFlow internal staff accounts stored in master_tenant.master_users.
  - name: Master / Plans
    description: >
      Manage subscription plans (Free, Pro, Enterprise) with billing cycles.
  - name: Master / Plan Features
    description: >
      Assign and toggle features on a specific plan.
      Sub-resource of Plans — paths are nested under /plans/:planId/.
  - name: Master / Plan Limits
    description: >
      Define quantitative limits per plan (e.g. max_users, max_workspaces).
      Sub-resource of Plans — paths are nested under /plans/:planId/.
  - name: Master / Features
    description: >
      Manage the global feature catalogue (feature keys that can be toggled per plan).
  - name: Master / Organizations
    description: >
      Provision and manage tenant organisations. Each org gets its own
      PostgreSQL schema. Domain mapping drives silent login routing.
      On creation, two emails are sent automatically — one to the org official
      email confirming provisioning, one to the owner with temporary login credentials.
  - name: Organization / Profile
    description: >
      Organization dashboard home — profile, live stats, and plan limit usage.
      Requires org context (Bearer token of an org user).
  - name: Organization / Roles
    description: >
      Manage custom org roles. System roles (organization_super_admin,
      organization_admin, organization_member) are seeded on org creation
      and cannot be modified or deleted.
  - name: Organization / Users
    description: >
      Manage org members — list, activate/deactivate, and remove users.
      User creation happens via the Invitations flow.
  - name: Organization / Invitations
    description: >
      Invite external users to join the organization. Includes a public
      accept-invitation endpoint (no auth) called when the user clicks the
      emailed invite link.
  - name: Workspace / Workspaces
    description: >
      Workspace CRUD. On creation a default #general channel is auto-provisioned
      and the creator is added as workspace_owner. Plan limit max_workspaces enforced.
  - name: Workspace / Members
    description: >
      Manage workspace membership. Users must already be org members.
      Roles: workspace_owner, workspace_admin, workspace_member.
  - name: Workspace / Channels
    description: >
      Channel management within a workspace. Channels are public or private.
      Channel names are always lowercase. Plan limit max_channels_per_workspace enforced.
  - name: Workspace / Channel Members
    description: >
      Manage who is in a channel. Includes self-service join/leave for public channels.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token returned by POST /auth/login.
        Valid for 1 day (or 30 days when rememberMe is true).

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Numeric record ID (BIGINT primary key)
      schema:
        type: integer
        format: int64
        example: 1

    QuerySearch:
      name: search
      in: query
      required: false
      description: Full-text search / keyword filter
      schema:
        type: string
        example: admin

    QueryPage:
      name: page
      in: query
      required: false
      description: Page number for pagination (1-based)
      schema:
        type: integer
        default: 1
        minimum: 1

    QueryLimit:
      name: limit
      in: query
      required: false
      description: Number of records per page
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

    QueryIsActive:
      name: is_active
      in: query
      required: false
      description: Filter by active / inactive status
      schema:
        type: boolean

  schemas:
    # ── Generic envelopes ─────────────────────────────────────────────────────
    StatusBlock:
      type: object
      properties:
        response_code:
          type: integer
          example: 200
        response_message:
          type: string
          example: "Success!"

    SuccessEnvelope:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusBlock"
        message:
          type: string
          example: "Operation successful"
        data:
          description: Payload — varies per endpoint
          nullable: true

    ErrorEnvelope:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusBlock"
        message:
          type: string
          example: "Something went wrong!"
        error:
          type: object
          properties:
            details:
              type: string
              example: "Invalid credentials."

    DeletedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              nullable: true
              example: null

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@gmail.com
          description: >
            Free-domain emails are routed to master users.
            Corporate/edu domains are routed to tenant org users.
        password:
          type: string
          format: password
          minLength: 6
          example: "StrongPass@123"
        rememberMe:
          type: boolean
          default: false
          description: Extends refresh token TTL from 7 days to 30 days.

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                    first_name:
                      type: string
                    last_name:
                      type: string
                    email:
                      type: string
                    role:
                      type: string
                      example: master_super_admin
                    userType:
                      type: string
                      example: master
                      description: >
                        "master" for MeetFlow staff, or the tenant
                        schema_name for org users.
                    must_change_password:
                      type: boolean
                      example: false
                      description: >
                        If true, the frontend must redirect to a forced
                        password-change screen before allowing further navigation.
                        Always false for master users. True for org owners on
                        first login (auto-generated password was used).
                org:
                  description: Non-null only for organisation users.
                  nullable: true
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    display_name:
                      type: string
                    logo:
                      type: string
                      nullable: true
                    schema_name:
                      type: string

    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: admin@gmail.com
          description: >
            Always returns 200 — the service never reveals whether the
            email exists (security best practice).

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Reset token from email link query param ?token=
          example: "a3f7c2d1e4b5..."
        newPassword:
          type: string
          format: password
          minLength: 8
          example: "NewPass@456"
        tenantSchema:
          type: string
          nullable: true
          description: >
            Org tenant schema name. Sent by the frontend from the
            ?schema= query param in the reset link. Null for master users.
          example: "org_acme_com"

    # ── Account ───────────────────────────────────────────────────────────────
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
          example: Jane
        last_name:
          type: string
          maxLength: 50
          example: Smith

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 6
          example: "OldPass@123"
        newPassword:
          type: string
          format: password
          minLength: 8
          example: "NewPass@456"

    # ── Master Role ───────────────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 70
          example: master_admin
        description:
          type: string
          nullable: true
          example: "Full access to master panel"
        is_system:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 70
          example: master_admin
        description:
          type: string
          example: "Full access to master panel"
        is_system:
          type: boolean
          default: true

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
        description:
          type: string
        is_system:
          type: boolean

    # ── Master User ───────────────────────────────────────────────────────────
    MasterUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@gmail.com
        role_id:
          type: integer
          example: 2
        is_active:
          type: boolean
          example: true
        last_login:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - role_id
      properties:
        first_name:
          type: string
          maxLength: 50
          example: John
        last_name:
          type: string
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: "StrongPass@123"
        role_id:
          type: integer
          example: 2
        is_active:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        role_id:
          type: integer
        is_active:
          type: boolean

    # ── Plan ──────────────────────────────────────────────────────────────────
    Plan:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Pro
        description:
          type: string
          example: "Best for growing teams"
        price:
          type: number
          format: double
          example: 29.99
        billing_cycle:
          type: string
          enum: [monthly, yearly, lifetime]
          example: monthly
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePlanRequest:
      type: object
      required:
        - name
        - billing_cycle
        - price
      properties:
        name:
          type: string
          maxLength: 70
          example: Pro
        description:
          type: string
          example: "Best for growing teams"
        price:
          type: number
          format: double
          minimum: 0
          example: 29.99
        billing_cycle:
          type: string
          enum: [monthly, yearly, lifetime]
          example: monthly
        is_active:
          type: boolean
          default: true

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        billing_cycle:
          type: string
          enum: [monthly, yearly, lifetime]
        is_active:
          type: boolean

    # ── Feature ───────────────────────────────────────────────────────────────
    Feature:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        feature_key:
          type: string
          example: video_meetings
          description: Unique snake_case key used in code-level checks
        name:
          type: string
          example: Video Meetings
        description:
          type: string
          nullable: true
          example: "Allows scheduling and joining video meetings"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFeatureRequest:
      type: object
      required:
        - feature_key
        - name
      properties:
        feature_key:
          type: string
          maxLength: 100
          example: video_meetings
          description: Unique snake_case identifier, used in code-level flag checks
        name:
          type: string
          maxLength: 100
          example: Video Meetings
        description:
          type: string
          nullable: true
          example: "Allows scheduling and joining video meetings"
        is_active:
          type: boolean
          default: true

    UpdateFeatureRequest:
      type: object
      properties:
        feature_key:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        description:
          type: string
        is_active:
          type: boolean

    # ── Plan Feature ──────────────────────────────────────────────────────────
    PlanFeature:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        plan_id:
          type: integer
          format: int64
          example: 2
        feature_id:
          type: integer
          format: int64
          example: 3
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    AssignFeatureRequest:
      type: object
      required:
        - feature_id
      properties:
        feature_id:
          type: integer
          format: int64
          description: ID of the feature to assign
          example: 3
        is_active:
          type: boolean
          default: true

    ToggleFeatureRequest:
      type: object
      required:
        - is_active
      properties:
        is_active:
          type: boolean
          example: false
          description: Set true to enable, false to disable the feature on this plan

    # ── Plan Limit ────────────────────────────────────────────────────────────
    PlanLimit:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        plan_id:
          type: integer
          format: int64
          example: 2
        limit_key:
          type: string
          example: max_users
          description: >
            Limit identifier key. Common values:
            max_users, max_workspaces, max_channels, max_meetings_per_month.
        limit_value:
          type: integer
          format: int64
          example: 50
          description: Set to 9999 to represent "Unlimited" in the UI.
        created_at:
          type: string
          format: date-time

    AddLimitRequest:
      type: object
      required:
        - limit_key
        - limit_value
      properties:
        limit_key:
          type: string
          example: max_users
          description: >
            Snake_case limit identifier. E.g. max_users,
            max_workspaces, max_channels, max_meetings_per_month.
        limit_value:
          type: integer
          format: int64
          minimum: 0
          example: 50
          description: Set to 9999 to represent "Unlimited".

    UpdateLimitRequest:
      type: object
      required:
        - limit_value
      properties:
        limit_value:
          type: integer
          format: int64
          minimum: 0
          example: 100
          description: Set to 9999 to represent "Unlimited".

    # ── Organization ──────────────────────────────────────────────────────────
    Organization:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        schema_name:
          type: string
          example: org_acme_com
          description: >
            PostgreSQL schema name — auto-generated from domain on creation.
            Format: org_ + domain with non-alphanumeric chars replaced by underscores.
        name:
          type: string
          example: Acme Corporation
        display_name:
          type: string
          example: Acme Corp
        logo:
          type: string
          nullable: true
          example: "https://cdn.acme.com/logo.png"
        domain:
          type: string
          example: acme.com
          description: >
            Corporate domain used for silent login routing.
            Free/personal domains (gmail, yahoo, etc.) are rejected.
        official_email:
          type: string
          format: email
          example: info@acme.com
          description: >
            Company official contact inbox (e.g. info@acme.com).
            Receives the org-created confirmation email.
            Not tied to any individual user account.
        primary_owner_email:
          type: string
          format: email
          example: jane@acme.com
          description: >
            Email of the org super admin. Reference field only —
            the actual user row lives in <schema_name>.users.
        plan_id:
          type: integer
          format: int64
          example: 2
          description: Every organisation must be on a plan. Required on creation.
        subscription_status:
          type: string
          enum: [active, trial, inactive, cancelled, suspended, expired]
          example: trial
          description: Starts as "trial" on creation. Changes to "active" when plan is assigned/confirmed.
        subscription_start_date:
          type: string
          format: date-time
          nullable: true
        subscription_end_date:
          type: string
          format: date-time
          nullable: true
        current_users_count:
          type: integer
          example: 1
          description: Incremented automatically as org users are created.
        current_workspaces_count:
          type: integer
          example: 0
        current_channels_count:
          type: integer
          example: 0
        current_meetings_this_month_count:
          type: integer
          example: 0
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - display_name
        - domain
        - official_email
        - plan_id
        - owner_first_name
        - owner_last_name
        - primary_owner_email
      properties:
        name:
          type: string
          maxLength: 120
          example: Acme Corporation
        display_name:
          type: string
          maxLength: 100
          example: Acme Corp
        domain:
          type: string
          maxLength: 100
          example: acme.com
          description: >
            Corporate domain for auto-login routing. Must be lowercase.
            Free/personal email domains (gmail.com, yahoo.com, etc.) are rejected.
            Owner email must belong to this domain.
        official_email:
          type: string
          format: email
          example: info@acme.com
          description: >
            Company official contact inbox. Receives the org-created confirmation email.
            Does not need to match the domain.
        logo:
          type: string
          nullable: true
          example: "https://cdn.acme.com/logo.png"
        plan_id:
          type: integer
          format: int64
          example: 2
          description: Required. Every org must be on a plan from day one.
        owner_first_name:
          type: string
          maxLength: 50
          example: Jane
          description: First name of the org super admin user.
        owner_last_name:
          type: string
          maxLength: 50
          example: Smith
          description: Last name of the org super admin user.
        primary_owner_email:
          type: string
          format: email
          example: jane@acme.com
          description: >
            Work email of the org super admin. Must belong to the org domain (@acme.com).
            A temporary password is auto-generated and emailed here.
            The owner must change it on first login.
        subscription_end_date:
          type: string
          format: date-time
          nullable: true
          example: "2027-01-01T00:00:00Z"

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        display_name:
          type: string
          maxLength: 100
        logo:
          type: string
          nullable: true
        domain:
          type: string
          maxLength: 100
        official_email:
          type: string
          format: email

    AssignPlanRequest:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: integer
          format: int64
          example: 3
        subscription_end_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"

    # ── Bulk Operations — Shared Response Schema ──────────────────────────────
    BulkFeatureResponse:
      type: object
      properties:
        successful:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        failed:
          type: array
          items:
            type: object
            properties:
              item:
                type: object
              error:
                type: string
        summary:
          type: object
          properties:
            total:
              type: integer
              example: 5
            successful:
              type: integer
              example: 4
            failed:
              type: integer
              example: 1

    # ── Bulk Roles ────────────────────────────────────────────────────────────
    BulkCreateRoleItem:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 70
          example: custom_admin
        description:
          type: string
          example: "Custom admin privileged role"
        is_system:
          type: boolean
          default: true

    BulkCreateRoleRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkCreateRoleItem"

    BulkUpdateRoleItem:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 70
        description:
          type: string
        is_system:
          type: boolean

    BulkUpdateRoleRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkUpdateRoleItem"

    BulkDeleteRoleRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Users ────────────────────────────────────────────────────────────
    BulkCreateUserItem:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - role_id
      properties:
        first_name:
          type: string
          maxLength: 50
          example: John
        last_name:
          type: string
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: "StrongPass@123"
        role_id:
          type: integer
          example: 2
        is_active:
          type: boolean
          default: true

    BulkCreateUserRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkCreateUserItem"

    BulkUpdateUserItem:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        role_id:
          type: integer
        is_active:
          type: boolean

    BulkUpdateUserRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkUpdateUserItem"

    BulkDeleteUserRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Plans ────────────────────────────────────────────────────────────
    BulkCreatePlanItem:
      type: object
      required:
        - name
        - price
        - billing_cycle
      properties:
        name:
          type: string
          maxLength: 70
          example: Starter
        description:
          type: string
          example: "For small teams"
        price:
          type: number
          format: double
          minimum: 0
          example: 199.00
        billing_cycle:
          type: string
          enum: [monthly, yearly, lifetime]
          example: monthly
        is_active:
          type: boolean
          default: true

    BulkCreatePlanRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkCreatePlanItem"

    BulkUpdatePlanItem:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 70
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        billing_cycle:
          type: string
          enum: [monthly, yearly, lifetime]
        is_active:
          type: boolean

    BulkUpdatePlanRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkUpdatePlanItem"

    BulkDeletePlanRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Features ─────────────────────────────────────────────────────────
    BulkCreateFeatureItem:
      type: object
      required:
        - feature_key
        - name
      properties:
        feature_key:
          type: string
          maxLength: 100
          example: video_meetings
        name:
          type: string
          maxLength: 100
          example: Video Meetings
        description:
          type: string
          nullable: true
          example: "Allows scheduling and joining video meetings"
        is_active:
          type: boolean
          default: true

    BulkCreateFeatureRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkCreateFeatureItem"
          example:
            - feature_key: video_meetings
              name: Video Meetings
              description: "Allows scheduling and joining video meetings"
            - feature_key: screen_share
              name: Screen Sharing

    BulkUpdateFeatureItem:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        feature_key:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        description:
          type: string
        is_active:
          type: boolean

    BulkUpdateFeatureRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkUpdateFeatureItem"
          example:
            - id: 1
              name: Updated Video Meetings
              is_active: true
            - id: 2
              is_active: false

    BulkDeleteFeatureRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Plan Features ────────────────────────────────────────────────────
    BulkAssignPlanFeatureItem:
      type: object
      required:
        - feature_id
      properties:
        feature_id:
          type: integer
          format: int64
          example: 3
        is_active:
          type: boolean
          default: true

    BulkAssignPlanFeatureRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkAssignPlanFeatureItem"

    BulkRemovePlanFeatureRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Plan Limits ──────────────────────────────────────────────────────
    BulkAddPlanLimitItem:
      type: object
      required:
        - limit_key
        - limit_value
      properties:
        limit_key:
          type: string
          maxLength: 100
          example: max_users
        limit_value:
          type: integer
          format: int64
          minimum: 0
          example: 50

    BulkAddPlanLimitRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkAddPlanLimitItem"

    BulkDeletePlanLimitRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Bulk Organizations ────────────────────────────────────────────────────
    BulkUpdateOrganizationItem:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          maxLength: 120
        display_name:
          type: string
          maxLength: 100
        logo:
          type: string
          nullable: true
        domain:
          type: string
          maxLength: 100
        official_email:
          type: string
          format: email

    BulkUpdateOrganizationRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkUpdateOrganizationItem"

    BulkDeleteOrganizationRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    BulkAssignPlanItem:
      type: object
      required:
        - id
        - plan_id
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Organization ID
        plan_id:
          type: integer
          format: int64
          example: 2

    BulkAssignPlanRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkAssignPlanItem"

  responses:
    UnauthorizedError:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            status:
              response_code: 401
              response_message: "Something went wrong!"
            message: "Access token is required."

    ForbiddenError:
      description: Authenticated but insufficient permissions (wrong context)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            status:
              response_code: 403
              response_message: "Something went wrong!"
            message: "This route is only accessible to master users."

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    BadRequestError:
      description: Validation error or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    # ── Organization / Profile ────────────────────────────────────────────────
    OrgStats:
      type: object
      properties:
        totalMembers:
          type: integer
          example: 12
        activeMembers:
          type: integer
          example: 10
        pendingInvitations:
          type: integer
          example: 3
        totalWorkspaces:
          type: integer
          example: 4
        totalChannels:
          type: integer
          example: 18

    PlanLimitWithUsage:
      type: object
      properties:
        limit_key:
          type: string
          example: max_workspaces
        limit_value:
          type: integer
          example: 10
          description: -1 means unlimited
        current_value:
          type: integer
          example: 4

    UpdateOrgSettingsRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          example: Acme Corporation
        display_name:
          type: string
          maxLength: 100
          example: Acme Corp
        logo:
          type: string
          nullable: true
          example: "https://cdn.acme.com/logo-v2.png"
        official_email:
          type: string
          format: email
          example: hello@acme.com

    # ── Organization / Roles ──────────────────────────────────────────────────
    OrgRole:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: organization_admin
        description:
          type: string
          nullable: true
          example: "Can manage org settings, users, and workspaces"
        is_system:
          type: boolean
          example: true
          description: System roles (organization_super_admin, organization_admin, organization_member) cannot be modified or deleted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrgRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 70
          example: department_manager
        description:
          type: string
          nullable: true
          example: "Can manage their department's channels and members"

    UpdateOrgRoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
        description:
          type: string
          nullable: true

    # ── Organization / Users ──────────────────────────────────────────────────
    OrgUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        first_name:
          type: string
          example: Alex
        last_name:
          type: string
          example: Johnson
        email:
          type: string
          format: email
          example: alex@acme.com
        is_active:
          type: boolean
          example: true
        is_deleted:
          type: boolean
          example: false
        must_change_password:
          type: boolean
          example: false
        last_login:
          type: string
          format: date-time
          nullable: true
        Role:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              example: organization_member
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Organization / Invitations ────────────────────────────────────────────
    Invitation:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: alex@acme.com
        role_id:
          type: integer
          example: 3
        status:
          type: string
          enum: [pending, accepted, cancelled, expired, rejected]
          example: pending
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        invited_by_id:
          type: integer
          nullable: true
        InvitedBy:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
        created_at:
          type: string
          format: date-time

    SendInvitationRequest:
      type: object
      required:
        - email
        - role_id
      properties:
        email:
          type: string
          format: email
          example: alex.johnson@acme.com
        role_id:
          type: integer
          format: int64
          example: 3
          description: ID of the org role to assign on acceptance

    AcceptInvitationRequest:
      type: object
      required:
        - token
        - tenant_schema
        - first_name
        - last_name
        - password
      properties:
        token:
          type: string
          description: Invitation token from the `?token=` query param in the invite link
          example: "a3f7c2d1e4b5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
        tenant_schema:
          type: string
          description: Org tenant schema name from the `?schema=` query param in the invite link
          example: "org_acme_com"
        first_name:
          type: string
          maxLength: 50
          example: Alex
        last_name:
          type: string
          maxLength: 50
          example: Johnson
        password:
          type: string
          format: password
          minLength: 8
          example: "MySecure@Pass1"

    # ── Workspace ─────────────────────────────────────────────────────────────
    Workspace:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Engineering
        description:
          type: string
          nullable: true
          example: "All things engineering"
        created_by_id:
          type: integer
          format: int64
          example: 2
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWorkspaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: Engineering
        description:
          type: string
          nullable: true
          example: "All things engineering"

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Engineering Team
        description:
          type: string
          nullable: true

    # ── Workspace Members ─────────────────────────────────────────────────────
    WorkspaceMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        workspace_id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 5
        role:
          type: string
          enum: [workspace_owner, workspace_admin, workspace_member]
          example: workspace_member
        User:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            is_active:
              type: boolean
        created_at:
          type: string
          format: date-time

    AddWorkspaceMemberRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          example: 5
          description: ID of the org user to add to this workspace
        role:
          type: string
          enum: [workspace_owner, workspace_admin, workspace_member]
          default: workspace_member
          example: workspace_member

    UpdateWorkspaceMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [workspace_owner, workspace_admin, workspace_member]
          example: workspace_admin

    # ── Channels ──────────────────────────────────────────────────────────────
    Channel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: general
          description: Always lowercase (normalised on create/update)
        description:
          type: string
          nullable: true
          example: "General discussion for everyone"
        workspace_id:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          enum: [public, private]
          example: public
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: announcements
          description: Will be lowercased automatically
        description:
          type: string
          nullable: true
          example: "Company-wide announcements"
        type:
          type: string
          enum: [public, private]
          default: public
          example: public
        member_ids:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          description: Initial member user IDs (only used for private channels)
          example: [5, 7, 8]

    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: announcements-v2
        description:
          type: string
          nullable: true

    # ── Channel Members ────────────────────────────────────────────────────────
    ChannelMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        channel_id:
          type: integer
          format: int64
          example: 3
        user_id:
          type: integer
          format: int64
          example: 5
        User:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
        created_at:
          type: string
          format: date-time

    AddChannelMemberRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          example: 5
          description: Must be a member of the parent workspace

    Meeting:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        channel_id:
          type: integer
          format: int64
          example: 3
        workspace_id:
          type: integer
          format: int64
          example: 2
        started_by_id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          nullable: true
          example: "Weekly Standup"
        livekit_room_name:
          type: string
          example: "meeting_abc123"
        status:
          type: string
          enum: [active, ended, cancelled]
          example: active
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
          example: 3600
        host:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
        created_at:
          type: string
          format: date-time

    MeetingParticipant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        meeting_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        livekit_identity:
          type: string
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
          nullable: true
        participant:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 3

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # COMMON — Health
  # ═══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Common / Health]
      summary: Health check
      description: Returns server status, uptime and current timestamp. No auth required.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: healthy
                          timestamp:
                            type: string
                            format: date-time
                          uptime:
                            type: number
                            example: 3600.5

  # ═══════════════════════════════════════════════════════════════════════════
  # COMMON — Auth
  # ═══════════════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Common / Auth]
      summary: Login (unified — master & org)
      description: |
        Single login endpoint for all user types.

        **Domain-based silent routing:**
        - Free/personal domain (gmail, yahoo, etc.) → master_users table
        - Corporate/edu domain with registered org → org tenant schema table
        - Corporate/edu domain with no registered org → fallback to master_users

        On success returns accessToken (1d TTL), refreshToken (7d / 30d with rememberMe).

        **must_change_password:** If true in the response, the frontend must show a
        forced password-change screen before allowing further navigation. This is set
        for org owners on first login since their password was auto-generated.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              masterUser:
                summary: Master user (free email domain)
                value:
                  email: admin@gmail.com
                  password: "StrongPass@123"
                  rememberMe: false
              orgOwner:
                summary: Org owner (first login with temp password)
                value:
                  email: jane@acme.com
                  password: "TempAuto@123"
                  rememberMe: false
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/logout:
    post:
      tags: [Common / Auth]
      summary: Logout
      description: Revokes the supplied refresh token from the database.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/refresh-token:
    post:
      tags: [Common / Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/forgot-password:
    post:
      tags: [Common / Auth]
      summary: Forgot password — send reset link
      description: |
        Triggers a password-reset email.
        Always returns 200 regardless of whether the email exists — prevents user enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/reset-password:
    post:
      tags: [Common / Auth]
      summary: Reset password
      description: |
        Resets the password using the token from the email link.
        Token is valid for 15 minutes.
        Also used by org owners to set their permanent password after first login.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"

