      summary: Get channels for user
      description: |
        Returns public channels + private channels where the user is a member.
        The user must be a workspace member.
      operationId: getChannelsForUser
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        "200":
          description: Channels retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/{workspaceId}/channels/get-channel-by-id/{channelId}:
    get:
      tags: [Workspace / Channels]
      summary: Get channel by ID
      description: For private channels, the user must be a member.
      operationId: getChannelById
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        "200":
          description: Channel retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/{workspaceId}/channels/create-channel:
    post:
      tags: [Workspace / Channels]
      summary: Create a channel
      description: |
        Creates a new channel in the workspace. The user must be a workspace member.
        Channel names are lowercased automatically (like Slack).
        For private channels, you can pass `member_ids` to add initial members.
        Plan limit `max_channels_per_workspace` is enforced.
      operationId: createChannel
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
            examples:
              publicChannel:
                summary: Public channel
                value:
                  name: announcements
                  description: "Company-wide announcements"
                  type: public
              privateChannel:
                summary: Private channel with initial members
                value:
                  name: design-team
                  description: "Private design discussions"
                  type: private
                  member_ids: [5, 7, 8]
      responses:
        "201":
          description: Channel created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Not a workspace member, or plan channel limit reached
        "409":
          description: Channel name already exists in this workspace

  /workspace/{workspaceId}/channels/update-channel/{channelId}:
    patch:
      tags: [Workspace / Channels]
      summary: Update a channel
      description: Only workspace owners and admins can update channels.
      operationId: updateChannel
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /workspace/{workspaceId}/channels/delete-channel/{channelId}:
    delete:
      tags: [Workspace / Channels]
      summary: Delete a channel
      description: |
        Only workspace admins or org admins can delete channels.
        The **#general** channel cannot be deleted.
      operationId: deleteChannel
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        "200":
          description: Channel deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ═══════════════════════════════════════════════════════════════════════════
