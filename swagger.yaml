            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /master/organizations/create-organization:
    post:
      tags: [Master / Organizations]
      summary: Create / provision an organization
      description: |
        Full org provisioning in one request:

        1. Creates the org record in master_tenant.organizations
        2. Provisions the PostgreSQL tenant schema
        3. Seeds default roles (organization_super_admin, organization_admin, organization_member)
        4. Creates the org super admin user in <schema_name>.users with an auto-generated password
        5. Sends two emails:
           - **Official email** (official_email): org confirmation with domain, plan, schema details
           - **Owner email** (primary_owner_email): temporary login credentials

        The owner's must_change_password flag is set to true — the frontend must
        redirect them to change their password immediately after first login.

        owner_password is NOT accepted — it is always auto-generated by the server.
      operationId: createOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
            example:
              name: Tech Echelons Pvt Ltd
              display_name: TechEchelons
              domain: techechelons.com
              official_email: info@techechelons.com
              owner_first_name: Adesh
              owner_last_name: Sharma
              primary_owner_email: adesh@techechelons.com
              plan_id: 2
              logo: "https://cdn.techechelons.com/logo.png"
      responses:
        "201":
          description: Organization created and schema provisioned successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /master/organizations/update-organization/{id}:
