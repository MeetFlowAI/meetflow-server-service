          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 3
        - $ref: "#/components/parameters/QuerySearch"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Channel members retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/ChannelMember"
                          total:
                            type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /workspace/{workspaceId}/channels/{channelId}/members/add-member:
    post:
      tags: [Workspace / Channel Members]
      summary: Add a member to a channel
      description: The user must be a workspace member. Cannot add to a channel they're already in.
      operationId: addChannelMember
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddChannelMemberRequest"
            example:
              user_id: 5
      responses:
        "201":
          description: Member added to channel successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChannelMember"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
