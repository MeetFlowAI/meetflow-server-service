          in: path
          required: true
          description: ID of the plan
          schema:
            type: integer
            format: int64
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAddPlanLimitRequest"
            example:
              items:
                - limit_key: max_members
                  limit_value: 100
                - limit_key: max_workspaces
                  limit_value: 10
                - limit_key: max_meetings_per_month
                  limit_value: 200
                - limit_key: message_history_days
                  limit_value: -1
      responses:
        "200":
          description: Bulk add limits completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          successful:
                            type: array
                            items:
