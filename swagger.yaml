  /master/plans/bulk-add-limits/{planId}:
    post:
      tags: [Master / Plan Limits]
      summary: Bulk add limits to a plan
      description: |
        Add multiple quantitative limits to a plan in a single request.
        This is the recommended way to seed all limits for a plan at once.

        **Common limit_key values:**
        `max_members`, `max_workspaces`, `max_channels_per_workspace`,
        `max_meetings_per_month`, `max_meeting_duration_minutes`,
        `max_meeting_participants`, `max_file_storage_mb`,
        `message_history_days`, `max_guests`, `max_ai_queries_per_month`.

        **Limits:** Maximum 100 items. Each limit_key must be unique in the request.
