  /master/plans/bulk-add-limits/{planId}:
    post:
      tags: [Master / Plan Limits]
      summary: Bulk add limits to a plan
      description: |
        Add multiple quantitative limits to a plan in a single request.
        This is the recommended way to seed all limits for a plan at once.

        **Common limit_key values:**
        `max_members`, `max_workspaces`, `max_channels_per_workspace`,
        `max_meetings_per_month`, `max_meeting_duration_minutes`,
        `max_meeting_participants`, `max_file_storage_mb`,
        `message_history_days`, `max_guests`, `max_ai_queries_per_month`.

        **Limits:** Maximum 100 items. Each limit_key must be unique in the request.
      operationId: bulkAddLimits
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          description: ID of the plan
          schema:
            type: integer
            format: int64
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAddPlanLimitRequest"
            example:
              items:
                - limit_key: max_members
                  limit_value: 100
                - limit_key: max_workspaces
                  limit_value: 10
                - limit_key: max_meetings_per_month
                  limit_value: 200
                - limit_key: message_history_days
                  limit_value: -1
      responses:
        "200":
          description: Bulk add limits completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
